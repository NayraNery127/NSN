<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>NSN - Documentação</title>
  <meta name="description" content="Documentação da API NSN — FastAPI, SQLAlchemy e SQLite">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root { --theme-color: #009688; }
    .metodo { display:inline-block; padding:2px 10px; border-radius:4px; color:#fff; font-weight:bold; font-size:.85em; }
    .get { background:#61affe; } .post { background:#49cc90; } .put { background:#fca130; } .delete { background:#f93e3e; }
  </style>
</head>
<body>
  <div id="app">Carregando...</div>
  <script>
    window.$docsify = {
      name: 'NSN',
      repo: 'https://github.com/NayraNery127/NSN',
      loadSidebar: true,
      subMaxLevel: 2,
      search: { placeholder: 'Buscar...', noData: 'Nada encontrado' },
      copyCode: { buttonText: 'Copiar', successText: 'Copiado!' }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
